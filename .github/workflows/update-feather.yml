name: Update feather.json

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build feather.json from all releases
        run: |
          curl -s https://api.github.com/repos/luqmanfadlli/NuvioMobile-iOS/releases > releases.json

          COUNT=$(jq 'length' releases.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "No releases found."
            exit 1
          fi

          VERSIONS=$(jq '
            [
              .[]
              | select(.draft == false)
              | {
                  tag: .tag_name,
                  date: .published_at,
                  ipa: (
                    .assets[]
                    | select(.name | ascii_downcase | endswith(".ipa"))
                    | {
                        url: .browser_download_url,
                        size: .size
                      }
                  )
                }
              | select(.ipa.url != null)
              | {
                  version: .tag,
                  date: .date,
                  localizedDescription: "GitHub release.",
                  downloadURL: .ipa.url,
                  size: .ipa.size,
                  minOSVersion: "15.0"
                }
            ]
          ' releases.json)

          VERSION_COUNT=$(echo "$VERSIONS" | jq 'length')
          if [ "$VERSION_COUNT" -eq 0 ]; then
            echo "No IPA assets found in releases."
            exit 1
          fi

          jq -n \
            --argjson versions "$VERSIONS" \
            '{
              name: "Nuvio Feather Repo",
              identifier: "com.nvmindl.feather",
              sourceURL: "https://github.com/nvmindl/Feather-/raw/refs/heads/main/feather.json",
              subtitle: "Auto-updated Nuvio source",
              description: "Auto-updated from luqmanfadlli/NuvioMobile-iOS releases.",
              iconURL: "https://github.com/nvmindl/Feather-/raw/refs/heads/main/icon.png",
              website: "https://github.com/luqmanfadlli/NuvioMobile-iOS",
              apps: [
                {
                  name: "Nuvio",
                  bundleIdentifier: "com.nuvio.mobile",
                  developerName: "luqmanfadlli",
                  subtitle: "iOS",
                  localizedDescription: "Auto-updated from luqmanfadlli/NuvioMobile-iOS releases.",
                  iconURL: "https://github.com/nvmindl/Feather-/raw/refs/heads/main/icon.png",
                  versions: $versions,
                  appPermissions: {
                    entitlements: [],
                    privacy: []
                  }
                }
              ],
              news: []
            }' > feather.json

      - name: Commit updated feather.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feather.json
          git diff --cached --quiet || git commit -m "Update feather.json from all releases"
          git push
