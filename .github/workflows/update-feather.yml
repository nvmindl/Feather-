name: Update feather.json

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get latest Nuvio release
        run: |
          curl -s https://api.github.com/repos/luqmanfadlli/NuvioMobile-iOS/releases/latest > latest.json

          TAG=$(jq -r '.tag_name // empty' latest.json)
          DATE=$(jq -r '.published_at // empty' latest.json)
          IPA_URL=$(jq -r '.assets[]? | select(.name | ascii_downcase | endswith(".ipa")) | .browser_download_url' latest.json | head -n 1)
          SIZE=$(jq -r '.assets[]? | select(.name | ascii_downcase | endswith(".ipa")) | .size' latest.json | head -n 1)

          if [ -z "$TAG" ] || [ -z "$IPA_URL" ]; then
            echo "No release or IPA asset found."
            exit 1
          fi

          jq -n \
            --arg tag "$TAG" \
            --arg date "$DATE" \
            --arg url "$IPA_URL" \
            --argjson size "${SIZE:-0}" \
            '{
              name: "Nuvio Feather Repo",
              subtitle: "Auto-updated Nuvio source",
              description: "Auto-updated from luqmanfadlli/NuvioMobile-iOS releases.",
              iconURL: "https://raw.githubusercontent.com/nvmindl/Feather-/main/icon.png",
              sourceURL: "https://raw.githubusercontent.com/nvmindl/Feather-/main/feather.json",
              website: "https://github.com/luqmanfadlli/NuvioMobile-iOS",
              apps: [
                {
                  name: "Nuvio",
                  bundleIdentifier: "com.nuvio.mobile",
                  developerName: "luqmanfadlli",
                  subtitle: "iOS",
                  localizedDescription: "Auto-updated from luqmanfadlli/NuvioMobile-iOS releases.",
                  iconURL: "https://raw.githubusercontent.com/nvmindl/Feather-/main/icon.png",
                  versions: [
                    {
                      version: $tag,
                      date: $date,
                      localizedDescription: "Latest GitHub release.",
                      downloadURL: $url,
                      size: $size,
                      minOSVersion: "15.0"
                    }
                  ],
                  appPermissions: {
                    entitlements: [],
                    privacy: {}
                  }
                }
              ],
              news: []
            }' > feather.json

      - name: Commit updated feather.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feather.json
          git diff --cached --quiet || git commit -m "Update feather.json from latest release"
          git push
